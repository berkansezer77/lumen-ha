name: An idea
description: Something Lumen HA should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
      description: What you are trying to achieve, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      placeholder: "An automation with a time_pattern trigger every 30 seconds."
