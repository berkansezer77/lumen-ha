name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Bu iş yalnız depoyu okur. Varsayılan izinler yazma da içerebiliyor; bir
# action ele geçirilirse elindeki yetkiyi kullanır, o yüzden en azı verilir.
permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # Action'lar değişebilen etiketlere (v4, main, master) değil tam commit
      # numarasına sabitlendi: bir etiket sessizce başka bir koda taşınabilir,
      # commit taşınamaz. Yükseltmek elle yapılır; yanındaki not ne olduğunu
      # söyler.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest validation
        # hassfest'in yayınlanmış sürümü yok; master'ın bugünkü hâli.
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Motor testleri: karar mantigi, sahte bir Home Assistant uzerinde.
      - name: Engine tests
        run: |
          for f in tests/engine/test_*.py; do
            echo "--- $f"
            python "$f"
          done
      # Panel testleri: arayuz jsdom'da acilip sinaniyor.
      - name: Panel tests
        run: npm install --no-audit --no-fund && node tests/run-panel.js
